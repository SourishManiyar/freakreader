# The synthetic papers of the layout oracle (README.md). Written for this repository: the prose is
# made up by `cargo xtask layout-oracle generate` from the seed and word lists in
# xtask/src/layout_oracle.rs. Body directives, one per line:
#   title|author|date|markright TEXT · maketitle · abstract N · section|subsection|subsubsection|section* [TEXT]
#   appendix · par N [footnote] [noindent] · cont N (no paragraph break: after a display)
#   display equation|align|gather|display|wide · list itemize|enumerate N · figure|table PLACEMENT [wide] · newpage
# Papers whose id starts `ho_` are held out: written before the analysis, and read only by their rates.
# amsart papers use \section alone: amsart's \subsection is run in, which this oracle does not bracket.

[[paper]]
