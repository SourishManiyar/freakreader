# The synthetic papers of the statement and reference oracle (README.md). Written for this
# repository: the prose is made up by `cargo xtask refs-oracle generate` from the seed and the layout
# oracle's word lists (xtask/src/layout_oracle.rs). Body directives, one per line:
#   title|author|date TEXT · maketitle · abstract N · section|subsection|section* [label=KEY] [TEXT]
#   appendix · par N [footnote] (a new paragraph) · cont N (no paragraph break)
#   begin ENV [label=KEY] [name=Words+Of+Name] N … end   (ENV: xtask/src/refs_oracle.rs ENVS)
#   proof [of=KEY] [sketch] [nomark] N … end
#   display equation|display|align|gather [label=KEY] [qedhere] · list itemize|enumerate N [paren]
#   figure|table PLACEMENT [label=KEY] [wide] · newpage
#   say KEY [word|abbr|bare|extra|auto] · say KEY1+KEY2 and|range · say ext KEY
#   say missing WORD NUMBER · say noise case|this|interval|count
# Papers whose id starts `ho_` are held out: written before the analysis, read only by their rates.

[[paper]]
id = "art11_plain"
holdout = false
class = "article"
options = ["11pt"]
geometry = "margin=1.1in"
pagestyle = "plain"
seed = 1101
heads = "bold"
numbering = "section"
shared = true
qed = "open"
hyperref = false
body = """
title Compact perturbations of bounded operators
author A. Writer
date
maketitle
section label=sec:intro Introduction
par 4
say thm:main
say sec:proofs
par 3
begin theorem label=thm:main name=Main+estimate 2
display equation label=eq:main
cont 1
end
par 3
say eq:main bare
section label=sec:prelim Preliminaries
par 3
begin definition label=def:adm 2
end
begin lemma label=lem:first 2
end
proof 3
say def:adm
end
begin lemma label=lem:second 3
list enumerate 3 paren
end
proof 2
say lem:first
say noise case
end
par 3
say lem:first+lem:second and
say eq:main
display equation label=eq:sum
cont 2
begin remark 2
say eq:sum bare
end
par 2
say noise this
figure t label=fig:one
section label=sec:proofs Proofs
par 2
say fig:one
proof of=thm:main 3
say lem:second extra
display display qedhere
end
begin corollary label=cor:one 2
end
proof 2
say thm:main abbr
say ext thm:main
end
begin example label=ex:one 3
end
par 3
say cor:one
say missing Lemma 9.7
say ex:one
say sec:prelim abbr
"""

