# The equation list of the math oracle (crates/render/tests/data/math/oracle/README.md).
#
# Written for this repository: common notation and textbook identities, no passages copied from
# papers or books. `cargo xtask math-oracle generate` typesets each equation on a page of its own
# and the paragraph pages below, and writes the truth next to this file.
#
# Fields of an equation:
#   id        unique, [a-z0-9_]
#   category  what it exercises (the report groups by it)
#   tier      1 plain: one line, symbols in a row with scripts at most
#             2 structure: fractions, radicals, limits, matrices, accents, alignment
#             3 hard to recover: the glyphs alone underdetermine the source, or the layout is
#               assembled from pieces; `hard` says why
#   env       inline, display, equation, align, align*, gather, gather*
#   tex       the body, on one line, as it would appear inside the environment
#   hard      required on tier 3 only

# ---- sub- and superscripts --------------------------------------------------------------------

[[equation]]
id = "sup_squares"
category = "scripts"
tier = 1
env = "inline"
tex = 'x^2 + y^2 = r^2'

