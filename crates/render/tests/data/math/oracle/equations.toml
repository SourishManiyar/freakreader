# ---- paragraph pages ----------------------------------------------------------------------------
#
# Running text around equations of the list, so a region must be isolated from the words around
# it. `{{id}}` places the equation `id` (in its own environment); the prose is plain text (no
# backslashes or dollar signs); a line `{{columnbreak}}` moves to the next column.

[[paragraph_page]]
id = "onecol_a"
columns = 1
text = '''
Consider a point on a circle, so that {{sup_squares}} holds for its coordinates. Halving and
thirding a cake gives {{frac_text_style}} of it, which is easy to check. A geometric series
{{sum_inline}} converges when the ratio is small, and the most famous relation of all reads
{{equation_numbered}}
where the constant is the speed of light. Nothing more is needed here, but the reader may wish
to compare the last display with the one on the next page.
'''

[[paragraph_page]]
id = "onecol_b"
columns = 1
text = '''
The integral {{int_inline}} measures the area under the curve, and the limit
{{lim_inline}} is the first one met in a course on calculus. When two points are close we write
{{abs_epsilon}} and move on. The Kronecker symbol is defined by
{{cases_numbered}}
and it appears in almost every computation with coordinates. A short aligned computation
closes the page:
{{align_two}}
'''

[[paragraph_page]]
id = "twocol_a"
columns = 2
text = '''
The squaring map {{mapsto}} is a first example of a map {{arrow_map}} between sets, which
sends each element somewhere. Greek letters such as {{greek_lower}} name angles in most books. The integers sit
in a chain of number systems, and the next display is numbered:
{{equation_numbered}}
which ends the first column.
{{columnbreak}}
In the second column a list {{ldots_list}} of unknowns is solved by elimination, and the
relations {{rel_order}} are read from left to right. A sum {{cdots_sum}} of the first numbers
was found by a schoolboy.
'''

[[paragraph_page]]
id = "twocol_b"
columns = 2
text = '''
Logarithms turn products into sums: {{log_product}} for positive numbers. The determinant
{{det_char}} gives the characteristic polynomial, and the binomial coefficient {{binom_inline}}
counts balanced paths. Two equations, numbered, follow:
{{gather_rows}}
{{columnbreak}}
Square roots such as {{sqrt_inline}} appear in running times. The expectation {{expectation}}
of a random variable is its mean, and a ratio {{slash_fraction}} is often written with a slash.
'''
