# The bibliography oracle's papers (README.md). Each is typeset by `cargo xtask bib-oracle generate`
# from these directives, citing entries of library.bib:
#
#   section WORDS          a numbered section
#   para N                 N sentences of made-up prose
#   cite K...              \cite{K,...} (a group when several); `?` draws the next entry of the pool
#   cite K at=Thm._3.1     \cite[Thm.~3.1]{K}: a locator after the label (`_` is a tie)
#   cite K in=Lemma_2.4    "By Lemma 2.4 in [K]"
#   citep K... / citet K / citeauthor K     natbib's (`at=` too)
#   range K1 K2            [n1--n2] from two labels (\cite numbers); the keys between are cited
#   hand K... form=p|t     a citation typed by hand in a list written by hand
#   statement K1 K2        a theorem whose name cites K1 and whose body cites K2
#   trap KIND              text that looks like a citation and is none: interval, interval2,
#                          numinterval, class, commutator, qnumber, section, display, item
#   bibliography           the list
#   appendix, newpage
#
# Papers whose id starts `ho_` are held out: written before the analysis existed, scored by their
# rates only (README.md, "Held-out papers").

# --- Development -------------------------------------------------------------------------------

